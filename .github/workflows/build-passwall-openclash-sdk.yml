name: Build PassWall PassWall2 OpenClash SDK 24.10.7

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: "24.10.7"
  TARGET: "qualcommax"
  SUBTARGET: "ipq807x"
  ARCH_PACKAGES: "aarch64_cortex-a53"
  SDK_FILE: "openwrt-sdk-24.10.7-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  RELEASE_TAG: "passwall-passwall2-openclash-sdk-24.10.7"
  RELEASE_NAME: "PassWall PassWall2 OpenClash SDK 24.10.7"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            tar \
            zstd \
            ccache

      - name: Download OpenWrt SDK
        run: |
          set -e

          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/${SDK_FILE}"
          SHA_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}/sha256sums"

          echo "Downloading SDK:"
          echo "$SDK_URL"

          wget -O "$SDK_FILE" "$SDK_URL"
          wget -O sha256sums "$SHA_URL"

          grep " ${SDK_FILE}$" sha256sums | sha256sum -c -

      - name: Extract OpenWrt SDK
        run: |
          set -e

          rm -rf openwrt-sdk
          mkdir -p openwrt-sdk

          tar --use-compress-program=unzstd -xf "$SDK_FILE" -C openwrt-sdk --strip-components=1

          echo "SDK extracted:"
          ls -la openwrt-sdk

      - name: Add current repo as local feed
        run: |
          set -e

          cd openwrt-sdk

          echo "" >> feeds.conf.default
          echo "src-link dotycat ${GITHUB_WORKSPACE}" >> feeds.conf.default

          echo "feeds.conf.default:"
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          set -e

          cd openwrt-sdk

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable PassWall PassWall2 and OpenClash
        run: |
          set -e

          cd openwrt-sdk

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_PACKAGE_luci-app-passwall=m
          CONFIG_PACKAGE_luci-app-passwall2=m
          CONFIG_PACKAGE_luci-app-openclash=m
          EOF

          make defconfig

          echo "Enabled packages:"
          grep -E "CONFIG_PACKAGE_luci-app-passwall|CONFIG_PACKAGE_luci-app-passwall2|CONFIG_PACKAGE_luci-app-openclash" .config || true

      - name: Download package sources
        run: |
          set -e

          cd openwrt-sdk

          make download -j$(nproc) || make download -j1 V=s

      - name: Build luci-app-passwall
        run: |
          set -e

          cd openwrt-sdk

          make package/feeds/dotycat/luci-app-passwall/compile -j$(nproc) V=s || \
          make package/feeds/dotycat/luci-app-passwall/compile -j1 V=s

      - name: Build luci-app-passwall2
        run: |
          set -e

          cd openwrt-sdk

          make package/feeds/dotycat/luci-app-passwall2/compile -j$(nproc) V=s || \
          make package/feeds/dotycat/luci-app-passwall2/compile -j1 V=s

      - name: Build luci-app-openclash
        run: |
          set -e

          cd openwrt-sdk

          make package/feeds/dotycat/luci-app-openclash/compile -j$(nproc) V=s || \
          make package/feeds/dotycat/luci-app-openclash/compile -j1 V=s

      - name: Collect release files
        run: |
          set -e

          rm -rf release
          mkdir -p release/ipk

          find openwrt-sdk/bin/packages -type f -name "*.ipk" -print -exec cp -a {} release/ipk/ \; || true
          find openwrt-sdk/bin/targets -type f -name "*.ipk" -print -exec cp -a {} release/ipk/ \; || true

          if ! find release/ipk -type f -name "*.ipk" | grep -q .; then
            echo "ERROR: no IPK files found"
            exit 1
          fi

          {
            echo "OpenWrt Version: ${OPENWRT_VERSION}"
            echo "Target: ${TARGET}/${SUBTARGET}"
            echo "Arch Packages: ${ARCH_PACKAGES}"
            echo "SDK: ${SDK_FILE}"
            echo "Build Date UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Built IPK files:"
            find release/ipk -type f -name "*.ipk" -printf "%f\n" | sort
          } > release/BUILD-INFO.txt

          cd release

          TAR_NAME="passwall-passwall2-openclash-ipk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.tar.gz"

          tar -czf "$TAR_NAME" ipk BUILD-INFO.txt
          sha256sum "$TAR_NAME" > "$TAR_NAME.sha256"

          echo "Release files:"
          ls -lh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          cd release

          TAR_NAME="passwall-passwall2-openclash-ipk-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.tar.gz"
          SHA_NAME="$TAR_NAME.sha256"

          RELEASE_BODY="$(cat BUILD-INFO.txt)"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release exists, updating notes and replacing assets..."

            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_NAME}" \
              --notes "${RELEASE_BODY}"

            gh release upload "${RELEASE_TAG}" \
              "$TAR_NAME" \
              "$SHA_NAME" \
              --clobber
          else
            echo "Creating new release..."

            gh release create "${RELEASE_TAG}" \
              "$TAR_NAME" \
              "$SHA_NAME" \
              --title "${RELEASE_NAME}" \
              --notes "${RELEASE_BODY}"
          fi
