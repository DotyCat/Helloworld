name: Sync Passwall LuCI Apps and Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # daily 02:00 Malaysia time

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "DotyCat"
          git config user.email "nanaxna493@gmail.com"

      - name: Clone Passwall repos
        run: |
          rm -rf /tmp/openwrt-passwall
          rm -rf /tmp/openwrt-passwall2
          rm -rf /tmp/openwrt-passwall-packages

          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/openwrt-passwall
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/openwrt-passwall2
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git /tmp/openwrt-passwall-packages

      - name: Prepare sync folder
        run: |
          rm -rf /tmp/passwall-sync
          mkdir -p /tmp/passwall-sync

          # Copy all packages from openwrt-passwall-packages
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/openwrt-passwall-packages/ /tmp/passwall-sync/

          # Copy only LuCI app folders
          rm -rf /tmp/passwall-sync/luci-app-passwall
          rm -rf /tmp/passwall-sync/luci-app-passwall2

          cp -a /tmp/openwrt-passwall/luci-app-passwall /tmp/passwall-sync/
          cp -a /tmp/openwrt-passwall2/luci-app-passwall2 /tmp/passwall-sync/

      - name: Add uci-defaults fix before exit
        run: |
          python3 <<'PY'
          from pathlib import Path
          import stat

          apps = [
              ("luci-app-passwall", "passwall"),
              ("luci-app-passwall2", "passwall2"),
          ]

          base = Path("/tmp/passwall-sync")

          for app, service in apps:
              uci_dir = base / app / "root" / "etc" / "uci-defaults"
              uci_dir.mkdir(parents=True, exist_ok=True)

              files = sorted([p for p in uci_dir.iterdir() if p.is_file()])

              if files:
                  target = files[0]
              else:
                  target = uci_dir / f"99-{service}"
                  target.write_text("#!/bin/sh\n\nexit 0\n")

              text = target.read_text()

              if f"/etc/init.d/{service} enable" in text:
                  print(f"{service}: already added in {target}")
                  continue

              block = [
                  f"[ -x /etc/init.d/{service} ] && /etc/init.d/{service} enable >/dev/null 2>&1",
                  "[ -x /etc/init.d/ucitrack ] && /etc/init.d/ucitrack restart >/dev/null 2>&1",
                  "",
              ]

              lines = text.splitlines()
              new_lines = []
              inserted = False

              for line in lines:
                  if line.strip() == "exit 0" and not inserted:
                      new_lines.extend(block)
                      inserted = True
                  new_lines.append(line)

              if not inserted:
                  if new_lines and new_lines[-1] != "":
                      new_lines.append("")
                  new_lines.extend(block)
                  new_lines.append("exit 0")

              target.write_text("\n".join(new_lines) + "\n")

              mode = target.stat().st_mode
              target.chmod(mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

              print(f"{service}: added fix to {target}")
          PY

      - name: Sync to current repo
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/passwall-sync/ ./

          rm -rf push

      - name: Commit and push changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "sync: update Passwall apps and packages"
          git push origin HEAD:${GITHUB_REF_NAME}
