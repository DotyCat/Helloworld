name: Sync Passwall LuCI Apps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # daily 02:00 Malaysia time

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "DotyCat"
          git config user.email "nanaxna493@gmail.com"

      - name: Clone Passwall repos
        run: |
          rm -rf /tmp/openwrt-passwall /tmp/openwrt-passwall2

          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/openwrt-passwall
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/openwrt-passwall2

      - name: Copy only LuCI app folders to repo root
        run: |
          rm -rf luci-app-passwall
          rm -rf luci-app-passwall2
          rm -rf push

          cp -a /tmp/openwrt-passwall/luci-app-passwall .
          cp -a /tmp/openwrt-passwall2/luci-app-passwall2 .

      - name: Add uci-defaults fix for LuCI Save & Apply
        run: |
          add_uci_defaults_fix() {
            APP_DIR="$1"
            SERVICE_NAME="$2"
            FILE="$APP_DIR/root/etc/uci-defaults/99-${SERVICE_NAME}-ucitrack-fix"

            mkdir -p "$APP_DIR/root/etc/uci-defaults"

            cat > "$FILE" <<EOF
#!/bin/sh

# Ensure LuCI Save & Apply can trigger ${SERVICE_NAME} reload through ucitrack.
# Real running state still follows ${SERVICE_NAME}.@global[0].enabled.
[ -x /etc/init.d/${SERVICE_NAME} ] && /etc/init.d/${SERVICE_NAME} enable >/dev/null 2>&1
[ -x /etc/init.d/ucitrack ] && /etc/init.d/ucitrack restart >/dev/null 2>&1

exit 0
EOF

            chmod +x "$FILE"
          }

          add_uci_defaults_fix "luci-app-passwall" "passwall"
          add_uci_defaults_fix "luci-app-passwall2" "passwall2"

      - name: Commit and push changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "sync: update Passwall LuCI apps"
          git push origin HEAD:${GITHUB_REF_NAME}
