name: Sync Passwall LuCI Apps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # daily 02:00 Malaysia time

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "DotyCat"
          git config user.email "nanaxna493@gmail.com"

      - name: Clone Passwall repos
        run: |
          rm -rf /tmp/openwrt-passwall /tmp/openwrt-passwall2

          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git /tmp/openwrt-passwall
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git /tmp/openwrt-passwall2

      - name: Copy only LuCI app folders to repo root
        run: |
          # Remove old folders first
          rm -rf luci-app-passwall
          rm -rf luci-app-passwall2

          # Remove old push folder if it was committed before
          rm -rf push

          # Copy LuCI app folders directly to repo root
          cp -a /tmp/openwrt-passwall/luci-app-passwall .
          cp -a /tmp/openwrt-passwall2/luci-app-passwall2 .

      - name: Commit and push changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "sync: update Passwall LuCI apps"
          git push origin HEAD:${GITHUB_REF_NAME}
